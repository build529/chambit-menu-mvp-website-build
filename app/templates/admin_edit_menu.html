<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {{ "Edit" if entry else "Create" }} menu entry · Chambit Menu
  </title>
  <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
  <main class="admin-shell">
    <p><a href="/admin">← Back to menu entries</a></p>

    <h1>{{ "Edit" if entry else "Create" }} menu entry</h1>

    <p class="help">
      Keep entries as Draft until the approved English menu and preview image
      have been reviewed. Published entries appear on the public website.
    </p>

    <form
      class="form-card"
      method="post"
      action="{% if entry %}/admin/{{ entry.id }}/save{% else %}/admin/save{% endif %}"
      enctype="multipart/form-data"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label>
        Service date
        <input
          type="date"
          name="service_date"
          required
          value="{{ entry.service_date if entry else '' }}"
        >
      </label>

      <label>
        Meal period
        <select name="meal_period" required>
          <option
            value="LUNCH"
            {% if entry and entry.meal_period == "LUNCH" %}selected{% endif %}
          >
            Lunch
          </option>
          <option
            value="BREAKFAST"
            {% if entry and entry.meal_period == "BREAKFAST" %}selected{% endif %}
          >
            Breakfast
          </option>
          <option
            value="DINNER"
            {% if entry and entry.meal_period == "DINNER" %}selected{% endif %}
          >
            Dinner
          </option>
        </select>
      </label>

      <label>
        Line type
        <select name="line_type" required>
          <option
            value="LEFT"
            {% if entry and entry.line_type == "LEFT" %}selected{% endif %}
          >
            Left Line
          </option>
          <option
            value="RIGHT"
            {% if entry and entry.line_type == "RIGHT" %}selected{% endif %}
          >
            Right Line
          </option>
          <option
            value="SHARED"
            {% if entry and entry.line_type == "SHARED" %}selected{% endif %}
          >
            Shared Line (Dinner only)
          </option>
        </select>
      </label>

      <label>
        Image source
        <select name="image_source" required>
          <option
            value="AI_GENERATED"
            {% if entry and entry.image_source == "AI_GENERATED" %}selected{% endif %}
          >
            AI generated preview
          </option>
          <option
            value="REAL"
            {% if entry and entry.image_source == "REAL" %}selected{% endif %}
          >
            Real cafeteria photo
          </option>
          <option
            value="STUDENT_UPLOADED"
            {% if entry and entry.image_source == "STUDENT_UPLOADED" %}selected{% endif %}
          >
            Student-uploaded photo
          </option>
        </select>
      </label>

      <label>
        Menu title <small>(optional)</small>
        <input
          type="text"
          name="menu_title"
          maxlength="120"
          value="{{ entry.menu_title if entry and entry.menu_title else '' }}"
          placeholder="Lunch · Left Line"
        >
      </label>

      <label>
        Approved English menu items
        <small>Enter one item per line.</small>
        <textarea
          name="menu_items"
          rows="8"
          required
          placeholder="Rice&#10;Spicy chicken&#10;Kimchi&#10;Soup"
        >{{ items_text if entry else '' }}</textarea>
      </label>

      <label>
        Raw approved source text <small>(internal, optional)</small>
        <textarea
          name="description_raw"
          rows="4"
          placeholder="Original English or Korean source text"
        >{{ entry.description_raw if entry and entry.description_raw else '' }}</textarea>
      </label>

      <label>
        Preview image
        {% if entry and entry.image_path_or_url %}
          <small>Leave blank to keep the current image.</small>
          <img
            class="thumb"
            src="{{ entry.image_path_or_url }}"
            alt="Current preview image"
          >
        {% else %}
          <small>JPEG, PNG, or WebP; maximum 10 MB.</small>
        {% endif %}
        <input
          type="file"
          name="image"
          accept="image/jpeg,image/png,image/webp"
        >
      </label>

      <label>
        Publication status
        <select name="status" required>
          <option
            value="DRAFT"
            {% if not entry or entry.status == "DRAFT" %}selected{% endif %}
          >
            Draft
          </option>
          <option
            value="PUBLISHED"
            {% if entry and entry.status == "PUBLISHED" %}selected{% endif %}
          >
            Published
          </option>
          <option
            value="ARCHIVED"
            {% if entry and entry.status == "ARCHIVED" %}selected{% endif %}
          >
            Archived
          </option>
        </select>
      </label>

      <label>
        Internal notes <small>(never shown publicly)</small>
        <textarea
          name="notes_internal"
          rows="4"
        >{{ entry.notes_internal if entry and entry.notes_internal else '' }}</textarea>
      </label>

      <button type="submit">
        {{ "Save changes" if entry else "Save entry" }}
      </button>
    </form>
  </main>
</body>
</html>
